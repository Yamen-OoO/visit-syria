<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Kufi+Arabic:wght@400;500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
   <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- css -->
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/library.css">
    <title>Visit Syria</title>
</head>
<body>
    <main>
        <section class="sectionHome" aria-labelledby="homeTitle">
            <div class="imgBirds" aria-hidden="true">
                <img src="./images/others/birds.png" alt=""  class="flip-x" >
            </div>
            <div class="container-fluid h-100">
                <div class="row herorow">
                     
                    <div class="col-12 col-lg-6 heroContent ">
                        <h1 id="homeTitle" class="welcomeText secondary-4">مرحبا بكم في سوريا</h1>
                        <h2 class=" herotitle">بلد الحضارات والتجارب الأصلية </h2>
                        <p class="heroDes ">
                             لنبدأ رحلة ممتعة ونكتشف المخفي في سوريا، أرض التاريخ العريق والتنوع والجمال الذي ينتظر من يكتشفه.
                        </p>
                         <div class="heroActions d-flex flex-wrap gap-3">
                            <a href="#services" class=" btnHero btnServices">الخدمات</a>
                            <a href="#guide" class=" btnHero btnGuide">الدليل السياحي</a>
                        </div>
                    </div>
                     <div class="col-12 col-lg-6 ">
                        <figure class="imgHome">
                            <img  id="heroImage"
                            class="flip-x" 
                                 src="./images/others/backgroundHome.png"
                                 alt="نواعير حماة والقناطر الحجرية القديمة على نهر العاصي"
                                 fetchpriority="high">
                        </figure>
                    </div>
                </div>
            </div>
        </section>
    </main>
 
         
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/library.js"></script>
</body>
</html>
